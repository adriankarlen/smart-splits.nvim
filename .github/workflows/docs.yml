on:
  push:
    branches: [master]
    paths:
      - README.md
      - PROTOCOL.md
      - .github/workflows/docs.yml
name: docs
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: panvimdoc README
        uses: kdheepak/panvimdoc@main
        with:
          vimdoc: smart-splits
          pandoc: README.md
          version: "Neovim >= 0.11.0"
          demojify: true
          treesitter: true
          # exclude the toplevel `# smart-splits.nvim` heading
          # because it makes the section tags have duped project name
          shiftheadinglevelby: -1
      - name: panvimdoc PROTOCOL
        uses: kdheepak/panvimdoc@main
        with:
          vimdoc: smart-splits-protocol
          pandoc: PROTOCOL.md
          version: "Neovim >= 0.11.0"
          demojify: true
          treesitter: true
          shiftheadinglevelby: -1
      - name: Generate helptags
        run: nix develop .#ci --command nvim --headless -c 'helptags doc' -c 'qa'
      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(docs): update vimdocs"
          title: "chore(docs): update vimdocs"
          branch: "automation/update-vimdocs"
          token: ${{ secrets.DOCS_PAT }}
          delete-branch: true
      - name: Enable PR auto-merge on CI success
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr review --approve "$PR_NUMBER"
          gh pr merge --squash --auto "$PR_NUMBER"
